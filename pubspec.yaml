name: glutpass
description: "GlutPass"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  # الصورتان تُحزَمان مع التطبيق لتستخدمهما شاشة البداية المتحرّكة،
  # فتطابق الصورة الثابتة بكسلاً ببكسل بلا أي قفزة
  assets:
    - assets/brand/

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/brand/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  background_image: "assets/brand/background.png"
  image: "assets/brand/splash.png"
  ios_content_mode: center
  ios: true
  android: false
  web: false
