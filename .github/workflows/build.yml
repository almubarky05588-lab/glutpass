name: Build iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'admin/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.glutpass.glutpass
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=ios --org com.glutpass --project-name glutpass .
          rm -rf lib pubspec.yaml
          cp -r /tmp/keep/lib .
          cp /tmp/keep/pubspec.yaml .
          rm -rf test

      - run: flutter pub get

      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 200 ))" >> $GITHUB_ENV

      - name: Build unsigned
        run: flutter build ios --release --no-codesign --build-number=${{ env.BUILD_NUMBER }}

      - name: Write API key
        run: |
          mkdir -p ios/keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ios/keys/AuthKey.p8

      - name: Set team in project
        run: |
          cd ios
          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = ${TEAM_ID};/g" Runner.xcodeproj/project.pbxproj || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.glutpass.glutpass;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" Runner.xcodeproj/project.pbxproj || true

      - name: Create Fastfile
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :beta do
              api_key = app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: "./keys/AuthKey.p8",
                in_house: false
              )

              # ينشئ شهادة ومِلف توزيع تلقائياً إن لم يوجدا
              sync_code_signing(
                type: "appstore",
                app_identifier: ENV["BUNDLE_ID"],
                team_id: ENV["TEAM_ID"],
                api_key: api_key,
                readonly: false,
                storage_mode: "google_cloud"
              ) rescue nil

              get_certificates(
                development: false,
                api_key: api_key,
                team_id: ENV["TEAM_ID"]
              )

              get_provisioning_profile(
                app_identifier: ENV["BUNDLE_ID"],
                api_key: api_key,
                team_id: ENV["TEAM_ID"],
                development: false
              )

              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: ENV["TEAM_ID"],
                bundle_identifier: ENV["BUNDLE_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: lane_context[SharedValues::SIGH_NAME]
              )

              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                configuration: "Release",
                export_method: "app-store",
                export_options: {
                  provisioningProfiles: {
                    ENV["BUNDLE_ID"] => lane_context[SharedValues::SIGH_NAME]
                  }
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY
          cat ios/fastlane/Fastfile

      - name: Run fastlane
        working-directory: ios
        env:
          FASTLANE_DISABLE_COLORS: 1
          MATCH_KEYCHAIN_NAME: build.keychain
        run: |
          gem install fastlane --no-document
          fastlane beta

      - name: Done
        run: echo "✅ رُفع إلى TestFlight"
