name: Build iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'admin/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.glutpass.glutpass
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: 1
      FASTLANE_HIDE_CHANGELOG: 1

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=ios --org com.glutpass --project-name glutpass .
          rm -rf lib pubspec.yaml
          cp -r /tmp/keep/lib .
          cp /tmp/keep/pubspec.yaml .
          rm -rf test

      - name: Patch Info.plist
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ar" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ar" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'يحتاج GlutPass الوصول لصورك لاختيار صورة حسابك أو شعار المكان.'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'يحتاج GlutPass الوصول لصورك لاختيار صورة حسابك أو شعار المكان.'" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'يحتاج GlutPass الكاميرا لالتقاط صورة حسابك أو شعار المكان.'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'يحتاج GlutPass الكاميرا لالتقاط صورة حسابك أو شعار المكان.'" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PL" || true
          /usr/libexec/PlistBuddy -c "Print" "$PL"

      - name: Add push entitlement
        run: |
          ENT=ios/Runner/Runner.entitlements
          if [ ! -f "$ENT" ]; then
            cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          PLIST
          fi
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT" \
            || /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text()
          if 'CODE_SIGN_ENTITLEMENTS' not in s:
              s = s.replace(
                  'PRODUCT_BUNDLE_IDENTIFIER = com.glutpass.glutpass;',
                  'PRODUCT_BUNDLE_IDENTIFIER = com.glutpass.glutpass;\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;')
              p.write_text(s)
              print('entitlements linked')
          else:
              print('already linked')
          PY

      - name: Custom AppDelegate for push
        run: |
          cat > ios/Runner/AppDelegate.swift <<'SWIFT'
          import Flutter
          import UIKit
          import FirebaseMessaging

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              // نطلب التسجيل صراحةً بدل انتظار أن يفعلها أحد
              application.registerForRemoteNotifications()
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }

            // نسلّم رمز آبل لـFirebase يداً بيد فور وصوله
            override func application(
              _ application: UIApplication,
              didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data
            ) {
              Messaging.messaging().apnsToken = deviceToken
              super.application(application,
                didRegisterForRemoteNotificationsWithDeviceToken: deviceToken)
            }

            override func application(
              _ application: UIApplication,
              didFailToRegisterForRemoteNotificationsWithError error: Error
            ) {
              NSLog("APNs registration failed: \(error.localizedDescription)")
              super.application(application,
                didFailToRegisterForRemoteNotificationsWithError: error)
            }
          }
          SWIFT
          cat ios/Runner/AppDelegate.swift

      - run: flutter pub get

      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 300 ))" >> $GITHUB_ENV

      - name: Build unsigned
        run: flutter build ios --release --no-codesign --build-number=${{ env.BUILD_NUMBER }}

      - name: Write API key
        run: |
          mkdir -p ios/keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ios/keys/AuthKey.p8

      - name: Create Fastfile
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :beta do
              # المسار المطلق ضروري: fastlane يعمل من داخل ios/fastlane
              # بينما المفتاح في ios/keys — والمسار النسبي كان يفشل بصمت
              key_path = File.expand_path("../keys/AuthKey.p8", __dir__)
              UI.important("مسار المفتاح: #{key_path} — موجود: #{File.exist?(key_path)}")

              api_key = app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: key_path,
                in_house: false
              )

              # حذف شهادات التوزيع القديمة — الخادم جديد كل مرة ولا يملك مفاتيحها
              begin
                require 'spaceship'
                UI.important("=== بدء تنظيف الشهادات ===")
                Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
                  key_id: ENV["ASC_KEY_ID"],
                  issuer_id: ENV["ASC_ISSUER_ID"],
                  filepath: key_path
                )
                all = Spaceship::ConnectAPI::Certificate.all
                UI.important("إجمالي الشهادات: #{all.count}")
                all.each { |c| UI.important("  #{c.id} — نوع: #{c.certificate_type}") }
                old = all.select do |c|
                  ["IOS_DISTRIBUTION", "DISTRIBUTION"].include?(c.certificate_type.to_s)
                end
                UI.important("شهادات توزيع قديمة: #{old.count}")
                old.each do |c|
                  begin
                    c.delete!
                    UI.important("حُذفت: #{c.id}")
                  rescue => e
                    UI.important("تعذّر حذف #{c.id}: #{e.class} — #{e.message}")
                  end
                end
                UI.important("=== انتهى التنظيف ===")
              rescue => e
                UI.important("!!! فشل التنظيف كلياً: #{e.class} — #{e.message}")
                UI.important(e.backtrace.first(5).join("\n")) if e.backtrace
              end

              create_keychain(
                name: "build.keychain",
                password: "temp1234",
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                lock_when_sleeps: false
              )

              cert(
                development: false,
                api_key: api_key,
                team_id: ENV["TEAM_ID"],
                keychain_path: File.expand_path("~/Library/Keychains/build.keychain-db"),
                keychain_password: "temp1234"
              )

              sigh(
                app_identifier: ENV["BUNDLE_ID"],
                api_key: api_key,
                team_id: ENV["TEAM_ID"],
                development: false,
                force: true
              )

              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: ENV["TEAM_ID"],
                bundle_identifier: ENV["BUNDLE_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: lane_context[SharedValues::SIGH_NAME]
              )

              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                configuration: "Release",
                export_method: "app-store",
                skip_profile_detection: true,
                export_options: {
                  provisioningProfiles: {
                    ENV["BUNDLE_ID"] => lane_context[SharedValues::SIGH_NAME]
                  }
                }
              )

              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY

      - name: Run fastlane
        working-directory: ios
        run: |
          gem install fastlane --no-document
          fastlane beta

      - name: Done
        run: echo "✅ رُفع إلى TestFlight"
