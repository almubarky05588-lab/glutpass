<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlutPass — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#146C43; --greenLt:#E8F3E4; --dark:#152018; --grey:#9AA79E;
  --border:#E5EAE5; --bg:#F4F6F4; --amber:#C2770F; --amberLt:#FDF0E0;
  --red:#C0392B; --redLt:#FCE7E4; --blue:#2A5A99; --blueLt:#E6EDF7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--dark)}
button{font-family:inherit;cursor:pointer;border:none}
[hidden]{display:none!important}
input,textarea,select{font-family:inherit;width:100%;padding:10px 12px;
  border:1px solid var(--border);border-radius:9px;background:#fff;
  font-size:14px;color:var(--dark)}
textarea{resize:vertical;min-height:70px;line-height:1.7}
.btn{padding:10px 18px;border-radius:9px;font-size:13px;font-weight:700;
  background:var(--green);color:#fff}
.btn.sec{background:#fff;color:var(--dark);border:1px solid var(--border)}
.btn.dgr{background:var(--redLt);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:4px 11px;border-radius:12px;
  font-size:11px;font-weight:700}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
.muted{color:var(--grey);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:380px;text-align:center}
#login h1{font-size:22px;margin:14px 0 4px}
#login .f{text-align:right;margin-top:14px}
#login label{font-size:12px;color:var(--grey);display:block;margin-bottom:5px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--green);
  margin:0 auto;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:24px;font-weight:700}
#app{display:flex;min-height:100vh}
aside{width:250px;background:#fff;border-left:1px solid var(--border);
  padding:22px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
aside .brand .logo{width:38px;height:38px;border-radius:12px;font-size:17px}
aside .brand b{font-size:16px;display:block}
nav button{display:block;width:100%;text-align:right;padding:11px 14px;
  border-radius:10px;background:none;font-size:13.5px;color:var(--dark);margin-bottom:4px}
nav button.on{background:var(--greenLt);color:var(--green);font-weight:700}
aside .out{position:absolute;bottom:22px;right:16px;left:16px}
main{flex:1;min-width:0}
header{background:#fff;border-bottom:1px solid var(--border);
  padding:18px 28px;display:flex;align-items:center;gap:12px}
header h2{font-size:19px}
#view{padding:24px 28px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--grey);text-align:right;padding:0 8px 10px;font-weight:700}
td{padding:12px 8px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}
tr.sel td{background:var(--greenLt)}
.grid{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.warn{background:var(--redLt);color:var(--red);padding:12px;border-radius:11px;
  font-size:12px;line-height:1.7;margin:12px 0}
.ok{background:var(--greenLt);color:var(--green);padding:12px;border-radius:11px;
  font-size:12.5px;margin:12px 0}
.drop{border:2px dashed var(--green);background:var(--bg);border-radius:12px;
  padding:26px;text-align:center;color:var(--green);font-size:13px;font-weight:700}
.thumb{width:132px;height:50px;border-radius:8px;object-fit:cover;background:var(--bg)}
.spec{background:var(--greenLt);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
.spec b{font-size:20px;color:var(--green);display:block}
.spec span{font-size:11.5px;color:var(--green)}
.sl{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--border);font-size:12px}
.sl:last-child{border:none}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  #app{flex-direction:column}
  aside{width:100%;height:auto;position:static;padding:12px 14px;
    border-left:none;border-bottom:1px solid var(--border)}
  aside .brand{margin-bottom:12px}
  nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  nav button{width:auto;white-space:nowrap;margin:0;flex-shrink:0;
    border:1px solid var(--border);padding:9px 15px;font-size:12.5px}
  aside .out{position:static;margin-top:10px}
  aside .out .btn{width:auto!important;padding:8px 16px;font-size:12px}
  header{padding:14px 16px}
  .card{overflow-x:auto}
  table{min-width:520px}
  td,th{padding:9px 6px;font-size:12px}
  #view{padding:14px}
}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">G</div>
    <h1>لوحة تحكم GlutPass</h1>
    <p class="muted">الدخول للمشرفين فقط</p>
    <div class="f"><label>البريد الإلكتروني</label><input id="em" type="email" placeholder="admin@glutpass.app"></div>
    <div class="f"><label>كلمة المرور</label><input id="pw" type="password"></div>
    <button class="btn" id="go" style="width:100%;margin-top:18px;padding:13px">دخول</button>
    <p id="lerr" style="color:var(--red);font-size:12px;margin-top:12px"></p>
  </div>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand">
      <div class="logo">G</div>
      <div><b>GlutPass</b><span class="muted">لوحة التحكم</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="out"><button class="btn sec" id="out" style="width:100%">تسجيل الخروج</button></div>
  </aside>
  <main>
    <header><h2 id="ttl"></h2><div class="sp"></div><span class="muted" id="who"></span></header>
    <section id="view"></section>
  </main>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://sreabyhmxetaynqqhlwe.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyZWFieWhteGV0YXlucXFobHdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzA3MjgsImV4cCI6MjEwMDg0NjcyOH0.a-5aEWl7FY9Q0CTK7AJVYvLCrW2MXNybfFFqh23xxN0';
const sb = createClient(URL, KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS = [['content','نصوص التطبيق'],['banners','البنرات'],
  ['subs','المساهمات'],['places','الأماكن والأمان']];
let tab='content';

$('#go').onclick = async () => {
  $('#lerr').textContent='';
  const { error } = await sb.auth.signInWithPassword({
    email:$('#em').value.trim(), password:$('#pw').value });
  if (error) { $('#lerr').textContent = error.message || 'تعذّر الدخول'; return; }
  boot();
};
$('#pw').onkeydown = e => { if(e.key==='Enter') $('#go').click(); };
$('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return;
  const { data:p } = await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
  if (!p || (p.role!=='admin' && p.role!=='moderator')) {
    $('#lerr').textContent='هذا الحساب ليس مشرفاً.'; await sb.auth.signOut(); return; }
  $('#login').hidden=true; $('#app').hidden=false;
  $('#who').textContent=(p.full_name||'مشرف')+' · '+(p.role==='admin'?'مدير النظام':'مشرف');
  $('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('');
  $('#nav').onclick = e => { const b=e.target.closest('button'); if(!b) return;
    tab=b.dataset.t; [...$('#nav').children].forEach(x=>x.classList.toggle('on',x.dataset.t===tab)); render(); };
  render();
}
function render(){
  $('#ttl').textContent=TABS.find(t=>t[0]===tab)[1];
  $('#view').innerHTML='<p class="muted">جارِ التحميل…</p>';
  ({content:vContent,banners:vBanners,subs:vSubs,places:vPlaces})[tab]();
}

let curKey=null;
async function vContent(){
  const { data:keys } = await sb.from('content_keys')
    .select('key,screen,description,tier,is_safety_critical').order('tier').order('key');
  const { data:vals } = await sb.from('content_values')
    .select('key,value,version,status').eq('status','published');
  const cur=Object.fromEntries((vals||[]).map(v=>[v.key,v]));
  const TC={A:['أ','var(--green)','var(--greenLt)'],B:['ب','var(--red)','var(--redLt)'],
    C:['ج','var(--blue)','var(--blueLt)']};
  $('#view').innerHTML=`<div class="grid">
    <div class="card"><table><thead><tr><th>المفتاح</th><th>الشاشة</th>
    <th>النص المنشور</th><th>الطبقة</th></tr></thead><tbody>
    ${(keys||[]).map(k=>{const t=TC[k.tier];return `<tr data-k="${esc(k.key)}" style="cursor:pointer"
      class="${k.key===curKey?'sel':''}">
      <td><b style="font-size:12px">${esc(k.key)}</b></td>
      <td class="muted">${esc(k.screen)}</td>
      <td>${esc(cur[k.key]?.value||'—')}</td>
      <td><span class="pill" style="color:${t[1]};background:${t[2]}">${t[0]}</span>
      ${k.is_safety_critical?'<span class="pill" style="color:var(--red)">حرج</span>':''}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div id="ed" class="card"><p class="muted">اختر مفتاحاً من الجدول لتحريره</p></div></div>`;
  $('#view').querySelector('tbody').onclick = e => {
    const tr=e.target.closest('tr'); if(!tr) return;
    curKey=tr.dataset.k;
    [...tr.parentNode.children].forEach(x=>x.classList.toggle('sel',x.dataset.k===curKey));
    editor(keys.find(k=>k.key===curKey),cur[curKey]);
    $('#ed').scrollIntoView({behavior:'smooth'});
  };
  if(curKey){const k=keys.find(x=>x.key===curKey); if(k) editor(k,cur[curKey]);}
}
function editor(k,v){
  const crit=k.is_safety_critical;
  $('#ed').innerHTML=`<b style="font-size:14px">${esc(k.key)}</b>
    <p class="muted" style="margin:4px 0 10px">${esc(k.description||'')}</p>
    ${crit?`<div class="warn">⚠ نص حرج للسلامة — تغييره يبدّل معنى تحذير صحي في التطبيق كله.
      يُسجَّل التعديل باسمك، والسبب إلزامي.</div>`:''}
    <label class="muted">النص المنشور حالياً</label>
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:9px;
      padding:10px;margin:6px 0 14px;font-size:13px">${esc(v?.value||'— لا يوجد —')}</div>
    <label class="muted">النص الجديد</label>
    <textarea id="nv">${esc(v?.value||'')}</textarea>
    <label class="muted" style="display:block;margin-top:12px">سبب التغيير
      ${crit?'<span style="color:var(--red)">· إلزامي</span>':'(اختياري)'}</label>
    <input id="nn" placeholder="اشرح سبب التعديل...">
    <div class="row" style="margin-top:16px">
      <button class="btn" id="pub">نشر للتطبيق</button>
      <button class="btn sec" id="drf">حفظ كمسودة</button></div>
    <p id="cmsg" style="font-size:12px;margin-top:10px"></p>`;
  const msg=(t,c)=>{const e=$('#cmsg');e.textContent=t;e.style.color=c;};
  const save = async st => {
    const val=$('#nv').value.trim(), note=$('#nn').value.trim();
    if(!val) return msg('اكتب النص أولاً','var(--red)');
    if(crit && !note) return msg('السبب إلزامي للنصوص الحرجة','var(--red)');
    const { error } = await sb.from('content_values').insert({
      key:k.key, locale:'ar', value:val, version:(v?.version||0)+1,
      status:st, change_note:note||null,
      updated_by:(await sb.auth.getUser()).data.user.id });
    if(error) return msg(error.message,'var(--red)');
    msg(st==='published'?'✓ نُشر':'✓ حُفظ كمسودة','var(--green)');
    setTimeout(vContent,900);
  };
  $('#pub').onclick=()=>save('published');
  $('#drf').onclick=()=>save('draft');
}

async function vBanners(){
  const { data:bs } = await sb.from('banners').select('*,places(name_ar)').order('sort_order');
  const { data:pl } = await sb.from('places').select('id,name_ar').order('name_ar');
  $('#view').innerHTML=`<div class="grid"><div>
    <div class="card" style="margin-bottom:20px"><b>البنرات في الشريط المتحرك</b>
    <p class="muted" style="margin:4px 0 14px">تتناوب أعلى الشاشة الرئيسية</p>
    ${(bs||[]).length?(bs||[]).map((b,i)=>`<div class="row" style="padding:12px 0;
      border-top:${i?'1px solid var(--border)':'none'};flex-wrap:wrap">
      <img class="thumb" src="${esc(b.image_url)}" alt="">
      <div style="flex:1;min-width:120px"><b style="font-size:13px">${esc(b.title_ar||'بلا عنوان')}</b>
      <div class="muted">${esc(b.places?.name_ar||'—')} · ترتيب ${b.sort_order}</div>
      <div class="muted">${b.impressions} ظهور · ${b.clicks} نقرة</div></div>
      <button class="btn sec bt" data-id="${b.id}" data-a="${b.is_active}">${b.is_active?'إيقاف':'تفعيل'}</button>
      <button class="btn dgr bd" data-id="${b.id}">حذف</button></div>`).join('')
      :'<p class="muted">لا توجد بنرات بعد</p>'}</div>
    <div class="card"><b>رفع بنر جديد</b>
      <div class="drop" style="margin:14px 0" id="dz">اضغط لاختيار صورة الإعلان<br>
      <span style="font-weight:400;color:var(--grey)">PNG أو JPG · ١٠٥٠×٣٩٦ · حتى ٢ ميجابايت</span></div>
      <input type="file" id="fl" accept="image/*" hidden>
      <img id="pv" style="width:100%;border-radius:10px;display:none;margin-bottom:12px">
      <label class="muted">عنوان البنر</label><input id="bt" placeholder="تجربة أرمنية فاخرة وآمنة">
      <label class="muted" style="display:block;margin-top:10px">المطعم المرتبط</label>
      <select id="bp"><option value="">— بلا ربط —</option>
      ${(pl||[]).map(p=>`<option value="${p.id}">${esc(p.name_ar)}</option>`).join('')}</select>
      <label class="muted" style="display:block;margin-top:10px">الترتيب</label>
      <input id="bo" type="number" value="${(bs||[]).length+1}">
      <button class="btn" id="bup" style="width:100%;margin-top:14px">رفع ونشر</button>
      <p id="bmsg" style="font-size:12px;margin-top:10px"></p></div></div>
    <div class="card"><b>مواصفات ملف الإعلان</b>
      <p class="muted" style="margin:4px 0 12px">أرسلها للمطعم</p>
      <div class="spec"><b>١٠٥٠ × ٣٩٦ بكسل</b><span>النسبة ٢٫٦٥ : ١ · دقة @3x</span></div>
      <div class="sl"><span class="muted">الصيغة</span><b>PNG أو JPG</b></div>
      <div class="sl"><span class="muted">الحجم الأقصى</span><b>٢ ميجابايت</b></div>
      <div class="sl"><span class="muted">المنطقة الآمنة</span><b>٤٠ بكسل من كل جهة</b></div>
      <div class="sl"><span class="muted">أصغر خط</span><b>٢٤ بكسل</b></div>
      <div class="sl"><span class="muted">العرض في التطبيق</span><b>٣٥٠ × ١٣٢ نقطة</b></div></div></div>`;
  $('#dz').onclick=()=>$('#fl').click();
  $('#fl').onchange=e=>{const f=e.target.files[0]; if(!f) return;
    $('#pv').src=window.URL.createObjectURL(f); $('#pv').style.display='block';};
  const bm=(t,c)=>{const x=$('#bmsg');x.textContent=t;x.style.color=c;};
  $('#bup').onclick = async () => {
    const f=$('#fl').files[0];
    if(!f) return bm('اختر صورة أولاً','var(--red)');
    if(f.size>2097152) return bm('الحجم أكبر من ٢ ميجابايت','var(--red)');
    bm('جارِ الرفع…','var(--grey)');
    const name=Date.now()+'_'+f.name.replace(/[^\w.]/g,'_');
    const up=await sb.storage.from('banners').upload(name,f);
    if(up.error) return bm(up.error.message,'var(--red)');
    const url=sb.storage.from('banners').getPublicUrl(name).data.publicUrl;
    const { error } = await sb.from('banners').insert({
      title_ar:$('#bt').value.trim()||null, place_id:$('#bp').value||null,
      image_url:url, image_width:1050, image_height:396,
      link_type:$('#bp').value?'place':'none', link_value:$('#bp').value||null,
      sort_order:+$('#bo').value||1, is_active:true,
      created_by:(await sb.auth.getUser()).data.user.id });
    if(error) return bm(error.message,'var(--red)');
    bm('✓ رُفع ونُشر','var(--green)'); setTimeout(vBanners,800);
  };
  $('#view').onclick = async e => {
    const t=e.target.closest('.bt'), d=e.target.closest('.bd');
    if(t){ await sb.from('banners').update({is_active:t.dataset.a!=='true'}).eq('id',t.dataset.id); vBanners(); }
    if(d && confirm('حذف هذا البنر نهائياً؟')){
      await sb.from('banners').delete().eq('id',d.dataset.id); vBanners(); }
  };
}

async function vSubs(){
  const { data:s } = await sb.from('place_submissions').select('*')
    .eq('status','pending').order('created_at',{ascending:false});
  const LV={SEPARATE_PREP:['آمن','var(--green)','var(--greenLt)'],
    SHARED_PREP:['مشتركة','var(--amber)','var(--amberLt)'],
    UNKNOWN:['غير معروف','var(--grey)','var(--bg)']};
  $('#view').innerHTML=`<div class="card"><b>مساهمات تنتظر المراجعة (${(s||[]).length})</b>
    <table style="margin-top:14px"><thead><tr><th>المكان</th><th>المدينة</th><th>النوع</th>
    <th>التصنيف</th><th>الأطباق</th><th>الإجراء</th></tr></thead><tbody>
    ${(s||[]).map(r=>{const l=LV[r.claimed_safety];return `<tr>
      <td><b>${esc(r.name)}</b><div class="muted">${esc(r.note||'')}</div></td>
      <td>${esc(r.city)}</td><td>${esc(r.place_type)}</td>
      <td><span class="pill" style="color:${l[1]};background:${l[2]}">${l[0]}</span></td>
      <td class="muted">${esc((r.suggested_dishes||[]).join('، '))}</td>
      <td><button class="btn ap" data-id="${r.id}">اعتماد</button>
      <button class="btn dgr rj" data-id="${r.id}">رفض</button></td></tr>`;}).join('')
      ||'<tr><td colspan="6" class="muted">لا توجد مساهمات معلّقة</td></tr>'}
    </tbody></table></div>`;
  $('#view').onclick = async e => {
    const a=e.target.closest('.ap'), r=e.target.closest('.rj');
    if(!a && !r) return;
    const me=(await sb.auth.getUser()).data.user.id;
    if(a){ await sb.from('place_submissions').update({status:'published',
      reviewed_by:me,reviewed_at:new Date().toISOString()}).eq('id',a.dataset.id); vSubs(); }
    if(r){ const why=prompt('سبب الرفض؟'); if(!why) return;
      await sb.from('place_submissions').update({status:'rejected',review_note:why,
        reviewed_by:me,reviewed_at:new Date().toISOString()}).eq('id',r.dataset.id); vSubs(); }
  };
}

async function vPlaces(){
  const { data:p } = await sb.from('places')
    .select('id,name_ar,city,computed_safety_status,override_safety_status,override_reason,safe_experience_pct,safety_votes_count')
    .order('safety_votes_count',{ascending:false});
  const N={SEPARATE_PREP:['آمن للسيلياك','var(--green)','var(--greenLt)'],
    SHARED_PREP:['تحقّق قبل الطلب','var(--amber)','var(--amberLt)'],
    UNKNOWN:['غير معروف','var(--grey)','var(--bg)']};
  $('#view').innerHTML=`<div class="card"><b>الأماكن</b>
    <p class="muted" style="margin:4px 0 14px">التجاوز اليدوي يُقفل التصنيف ويستوجب سبباً</p>
    <table><thead><tr><th>المكان</th><th>المدينة</th><th>محسوب تلقائياً</th>
    <th>تجاوز يدوي</th><th>تجارب الأمان</th><th>الإجراء</th></tr></thead><tbody>
    ${(p||[]).map(x=>{const c=N[x.computed_safety_status],
      o=x.override_safety_status?N[x.override_safety_status]:null;
      return `<tr><td><b>${esc(x.name_ar)}</b></td><td>${esc(x.city)}</td>
      <td><span class="pill" style="color:${c[1]};background:${c[2]}">${c[0]}</span></td>
      <td>${o?`<span class="pill" style="color:${o[1]};background:${o[2]}">${o[0]}</span>
        <div class="muted">${esc(x.override_reason||'')}</div>`:'<span class="muted">—</span>'}</td>
      <td>${x.safe_experience_pct?x.safe_experience_pct+'٪ · '+x.safety_votes_count:'—'}</td>
      <td>${o?`<button class="btn sec clr" data-id="${x.id}">إلغاء التجاوز</button>`
        :`<button class="btn sec ovr" data-id="${x.id}">تجاوز</button>`}</td></tr>`;}).join('')}
    </tbody></table></div>`;
  $('#view').onclick = async e => {
    const o=e.target.closest('.ovr'), c=e.target.closest('.clr');
    if(o){
      const v=prompt('التصنيف الجديد:\n1 = آمن للسيلياك\n2 = تحقّق قبل الطلب\n3 = غير معروف');
      const map={'1':'SEPARATE_PREP','2':'SHARED_PREP','3':'UNKNOWN'};
      if(!map[v]) return;
      const why=prompt('سبب التجاوز (إلزامي):');
      if(!why||!why.trim()) return alert('السبب إلزامي');
      const { error } = await sb.from('places').update({override_safety_status:map[v],
        override_reason:why.trim(), override_by:(await sb.auth.getUser()).data.user.id })
        .eq('id',o.dataset.id);
      if(error) alert(error.message);
      vPlaces();
    }
    if(c && confirm('إرجاع التصنيف للحساب التلقائي؟')){
      await sb.from('places').update({override_safety_status:null,override_reason:null,
        override_by:null,override_at:null}).eq('id',c.dataset.id);
      vPlaces();
    }
  };
}
// ═══ نظرة عامة ═══
async function vHome(){
  const c=sb;
  const [pl,sub,rep,vt] = await Promise.all([
    c.from('places').select('id,name_ar,city,effective_safety_status,override_safety_status,safe_experience_pct,safety_votes_count,dishes_count'),
    c.from('place_submissions').select('id').eq('status','pending'),
    c.from('reports').select('id').eq('status','open'),
    c.from('votes').select('id')
  ]);
  const P=pl.data||[];
  const cnt=s=>P.filter(x=>x.effective_safety_status===s).length;
  const tot=P.length||1;
  const dishes=P.reduce((a,x)=>a+(x.dishes_count||0),0);
  const exp=P.reduce((a,x)=>a+(x.safety_votes_count||0),0);
  const ov=P.filter(x=>x.override_safety_status);
  const K=[['أماكن منشورة',P.length,'var(--green)','var(--greenLt)'],
    ['مساهمات تنتظر',(sub.data||[]).length,'var(--amber)','var(--amberLt)'],
    ['تجارب أمان',exp,'var(--green)','var(--greenLt)'],
    ['بلاغات مفتوحة',(rep.data||[]).length,'var(--red)','var(--redLt)']];
  const D=[['آمن للسيلياك',cnt('SEPARATE_PREP'),'var(--green)'],
    ['تحقّق قبل الطلب',cnt('SHARED_PREP'),'var(--amber)'],
    ['غير معروف',cnt('UNKNOWN'),'var(--grey)']];
  $('#view').innerHTML=`
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px">
    ${K.map(k=>`<div class="card" style="padding:16px">
      <div style="width:32px;height:32px;border-radius:10px;background:${k[3]};margin-bottom:10px"></div>
      <b style="font-size:26px;color:${k[2]};display:block">${k[1]}</b>
      <span class="muted">${k[0]}</span></div>`).join('')}
  </div>
  <div class="grid">
    <div class="card"><b>تجاوزات يدوية سارية</b>
      <p class="muted" style="margin:4px 0 14px">تصنيفات أوقفها مشرف عن الحساب التلقائي</p>
      ${ov.length?ov.map(x=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--border)">
        <span class="pill" style="color:var(--amber);background:var(--amberLt)">مقفل</span>
        <div style="flex:1"><b style="font-size:13px">${esc(x.name_ar)}</b>
        <div class="muted">${esc(x.city)}</div></div></div>`).join('')
        :'<p class="muted">لا توجد تجاوزات — كل التصنيفات محسوبة تلقائياً ✓</p>'}
    </div>
    <div class="card"><b>توزيع تصنيف الأمان</b>
      <p class="muted" style="margin:4px 0 16px">${P.length} مكاناً · ${dishes} طبقاً</p>
      ${D.map(d=>`<div style="margin-bottom:16px">
        <div class="row" style="margin-bottom:6px"><span style="font-size:12.5px">${d[0]}</span>
        <div class="sp"></div><b style="color:${d[2]};font-size:12.5px">${d[1]} مكان</b></div>
        <div style="height:9px;background:var(--bg);border-radius:5px;overflow:hidden">
        <div style="height:100%;width:${Math.round(d[1]/tot*100)}%;background:${d[2]};
          border-radius:5px;margin-right:auto"></div></div></div>`).join('')}
    </div>
  </div>`;
}

// ═══ البلاغات والمستخدمون ═══
async function vMod(){
  const [rp,us] = await Promise.all([
    sb.from('reports').select('*,places(name_ar)').eq('status','open').order('created_at',{ascending:false}),
    sb.from('profiles').select('id,full_name,city,is_celiac,role,is_banned,trust_score').order('trust_score',{ascending:false})
  ]);
  const R=rp.data||[], U=us.data||[];
  $('#view').innerHTML=`
  <div class="card" style="margin-bottom:20px">
    <b>بلاغات تنتظر المراجعة (${R.length})</b>
    <p class="muted" style="margin:4px 0 14px">البلاغات الصحية لها أولوية</p>
    ${R.length?R.map(r=>`<div style="padding:14px 0;border-top:1px solid var(--border)">
      <div class="row" style="flex-wrap:wrap;margin-bottom:8px">
        <span class="pill" style="color:var(--red);background:var(--redLt)">${esc(r.reason)}</span>
        <span class="muted">${esc(r.places?.name_ar||'—')} · ${esc(r.target_type)}</span></div>
      <div style="font-size:13px;margin-bottom:10px">${esc(r.detail||'')}</div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn dgr rd" data-id="${r.id}">حذف المحتوى</button>
        <button class="btn sec ri" data-id="${r.id}">تجاهل البلاغ</button></div>
    </div>`).join('')
      :'<p class="muted">لا توجد بلاغات مفتوحة ✓</p>'}
  </div>
  <div class="card"><b>المستخدمون (${U.length})</b>
    <p class="muted" style="margin:4px 0 14px">${U.filter(u=>u.is_celiac).length} منهم مرضى سيلياك — أصواتهم بوزن مضاعف</p>
    <table><thead><tr><th>المستخدم</th><th>المدينة</th><th>سيلياك</th>
    <th>الثقة</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>
    ${U.map(u=>`<tr>
      <td><b>${esc(u.full_name||'مستخدم')}</b></td>
      <td>${esc(u.city||'—')}</td>
      <td>${u.is_celiac?'<span class="pill" style="color:var(--green);background:var(--greenLt)">نعم</span>':'<span class="muted">—</span>'}</td>
      <td><b>${u.trust_score}</b></td>
      <td>${u.role==='admin'?'مدير':u.role==='moderator'?'مشرف':'مستخدم'}</td>
      <td>${u.is_banned?'<span class="pill" style="color:var(--red);background:var(--redLt)">محظور</span>'
        :'<span class="pill" style="color:var(--green);background:var(--greenLt)">نشط</span>'}</td>
      <td>${u.role==='admin'?'<span class="muted">—</span>':
        `<button class="btn ${u.is_banned?'sec':'dgr'} ub" data-id="${u.id}" data-b="${u.is_banned}">
        ${u.is_banned?'رفع الحظر':'حظر'}</button>`}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#view').onclick = async e => {
    const d=e.target.closest('.rd'), i=e.target.closest('.ri'), b=e.target.closest('.ub');
    const me=(await sb.auth.getUser()).data.user.id;
    if(d && confirm('حذف المحتوى المبلَّغ عنه وإغلاق البلاغ؟')){
      await sb.from('reports').update({status:'resolved',resolution:'حُذف المحتوى',
        resolved_by:me,resolved_at:new Date().toISOString()}).eq('id',d.dataset.id); vMod(); }
    if(i){ await sb.from('reports').update({status:'ignored',resolution:'بلاغ غير صحيح',
      resolved_by:me,resolved_at:new Date().toISOString()}).eq('id',i.dataset.id); vMod(); }
    if(b){ const ban=b.dataset.b!=='true';
      if(!confirm(ban?'حظر هذا المستخدم؟':'رفع الحظر؟')) return;
      const { error } = await sb.from('profiles').update({is_banned:ban}).eq('id',b.dataset.id);
      if(error) alert(error.message);
      vMod(); }
  };
}

// ═══ الإشعارات ═══
async function vNotif(){
  const [cp,pl,us] = await Promise.all([
    sb.from('notification_campaigns').select('*').order('created_at',{ascending:false}),
    sb.from('places').select('id,name_ar').order('name_ar'),
    sb.from('profiles').select('id,is_celiac')
  ]);
  const C=cp.data||[], P=pl.data||[], U=us.data||[];
  const ST={draft:['مسودة','var(--grey)','var(--bg)'],
    scheduled:['مجدولة','var(--amber)','var(--amberLt)'],
    sent:['مرسلة','var(--green)','var(--greenLt)'],
    cancelled:['ملغاة','var(--red)','var(--redLt)']};
  $('#view').innerHTML=`
  <div class="warn" style="background:var(--amberLt);color:var(--amber)">
    ⏳ خدمة الإرسال (FCM) لم تُفعّل بعد — تحتاج مفتاح APNs من حساب آبل.
    الحملات تُحفظ الآن كاملةً وتُرسل فور التفعيل.</div>
  <div class="grid"><div>
    <div class="card" style="margin-bottom:20px"><b>حملة إشعار جديدة</b>
      <p class="muted" style="margin:4px 0 14px">تصل أجهزة المستخدمين المطابقين</p>
      <label class="muted">عنوان الإشعار</label>
      <input id="nt" placeholder="جرّب قائمة لوسين الجديدة">
      <label class="muted" style="display:block;margin-top:12px">نص الإشعار</label>
      <textarea id="nb" placeholder="مطعم لوسين أضاف ٦ أطباق آمنة معتمدة..."></textarea>
      <label class="muted" style="display:block;margin-top:12px">الجمهور المستهدف</label>
      <select id="na">
        <option value="all">الجميع (${U.length})</option>
        <option value="celiac_only">مرضى السيلياك فقط (${U.filter(u=>u.is_celiac).length})</option>
        <option value="city">حسب المدينة</option>
        <option value="saved_place">من حفظوا مكاناً معيّناً</option>
      </select>
      <label class="muted" style="display:block;margin-top:12px">الوجهة عند الضغط</label>
      <select id="nd"><option value="none">لا شيء</option>
        ${P.map(p=>`<option value="${p.id}">صفحة — ${esc(p.name_ar)}</option>`).join('')}</select>
      <div class="row" style="margin-top:16px;flex-wrap:wrap">
        <button class="btn" id="nsave">حفظ الحملة</button>
        <button class="btn sec" disabled title="يحتاج FCM">إرسال — معطّل</button></div>
      <p id="nmsg" style="font-size:12px;margin-top:10px"></p>
    </div>
    <div class="card"><b>الحملات (${C.length})</b>
      <table style="margin-top:12px"><thead><tr><th>العنوان</th><th>الجمهور</th>
      <th>الوصول المقدّر</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${C.map(x=>{const s=ST[x.status]||ST.draft;return `<tr>
        <td><b>${esc(x.title_ar)}</b><div class="muted">${esc(x.body_ar).slice(0,50)}…</div></td>
        <td class="muted">${x.audience_type==='celiac_only'?'سيلياك':x.audience_type==='all'?'الجميع':esc(x.audience_type)}</td>
        <td>${x.estimated_reach}</td>
        <td><span class="pill" style="color:${s[1]};background:${s[2]}">${s[0]}</span></td>
        <td><button class="btn dgr cdel" data-id="${x.id}">حذف</button></td></tr>`;}).join('')
        ||'<tr><td colspan="5" class="muted">لا توجد حملات بعد</td></tr>'}
      </tbody></table></div>
  </div>
  <div class="card"><b>الإشعارات التلقائية</b>
    <p class="muted" style="margin:4px 0 14px">يرسلها النظام بلا تدخل</p>
    ${[['تغيّر تصنيف مكان محفوظ','تنبيه صحي — لا يمكن للمستخدم إيقافه',true],
       ['قبول مكان أضافه المستخدم','',false],
       ['رفض مكان مع بيان السبب','',false],
       ['شكر عند بلوغ عدد تصويتات','',false],
       ['حملات تسويقية','بحد أقصى ٢ أسبوعياً',false]]
      .map((a,i)=>`<div style="padding:12px 0;border-top:${i?'1px solid var(--border)':'none'}">
      <b style="font-size:12.5px">${a[0]}</b>
      ${a[1]?`<div style="font-size:11px;color:${a[2]?'var(--red)':'var(--grey)'};margin-top:3px">${a[1]}</div>`:''}
      ${a[2]?'<span class="pill" style="color:var(--red);background:var(--redLt);margin-top:6px">مقفل دائماً</span>':''}
      </div>`).join('')}
  </div></div>`;
  const nm=(t,c)=>{const x=$('#nmsg');x.textContent=t;x.style.color=c;};
  $('#nsave').onclick = async () => {
    const t=$('#nt').value.trim(), b=$('#nb').value.trim();
    if(!t||!b) return nm('اكتب العنوان والنص','var(--red)');
    const aud=$('#na').value;
    const reach = aud==='celiac_only' ? U.filter(u=>u.is_celiac).length : U.length;
    const { error } = await sb.from('notification_campaigns').insert({
      title_ar:t, body_ar:b, audience_type:aud,
      deeplink_type:$('#nd').value==='none'?'none':'place',
      deeplink_value:$('#nd').value==='none'?null:$('#nd').value,
      status:'draft', estimated_reach:reach,
      created_by:(await sb.auth.getUser()).data.user.id });
    if(error) return nm(error.message,'var(--red)');
    nm('✓ حُفظت الحملة — ستُرسل فور تفعيل FCM','var(--green)');
    setTimeout(vNotif,900);
  };
  $('#view').onclick = async e => {
    const d=e.target.closest('.cdel');
    if(d && confirm('حذف هذه الحملة؟')){
      await sb.from('notification_campaigns').delete().eq('id',d.dataset.id); vNotif(); }
  };
}

sb.auth.getSession().then(({data})=>{ if(data.session) boot(); });
</script>
